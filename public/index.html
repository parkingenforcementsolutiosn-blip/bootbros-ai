<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>BootBros | Login</title>

  <link rel="stylesheet" href="/app.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="brand">
        <div class="brand-mark">B</div>

        <div>
          <h1>BootBros</h1>
          <p>Parking Enforcement</p>
        </div>
      </div>

      <div class="login-header">
        <h2>Welcome back</h2>
        <p>Sign in to your BootBros account.</p>
      </div>

      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          placeholder="admin@bootbros.com"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >

        <button
          id="loginButton"
          type="submit"
        >
          Sign In
        </button>

        <div
          id="loginMessage"
          class="message"
          aria-live="polite"
        ></div>

      </form>

      <div class="login-footer">
        BootBros Secure Operations
      </div>

    </section>

  </main>

  <script src="/app.js"></script>

</body>
</html>
