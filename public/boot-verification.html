<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BootBros | Verify Vehicle</title>

  <link rel="stylesheet" href="/app.css">

  <style>
    .page {
      min-height: 100vh;
      background: #f5f7fa;
    }

    .header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: white;
      border-bottom: 1px solid #e5e9ef;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #071b35;
      font-size: 20px;
      font-weight: 800;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1557b0;
      color: white;
      border-radius: 10px;
    }

    .back {
      color: #344054;
      text-decoration: none;
      font-weight: 600;
    }

    .main {
      max-width: 850px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 6px;
      color: #071b35;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #667085;
    }

    .card {
      margin-bottom: 20px;
      padding: 26px;
      background: white;
      border: 1px solid #e1e7ef;
      border-radius: 14px;
    }

    .card h2 {
      margin-top: 0;
      color: #071b35;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #667085;
      font-size: 12px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      color: #101828;
      font-size: 14px;
    }

    .field input[readonly] {
      background: #f8fafc;
    }

    .checkbox {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      cursor: pointer;
    }

    .checkbox input {
      margin-top: 3px;
    }

    .checkbox strong {
      color: #344054;
    }

    .checkbox div {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    .button {
      margin-top: 20px;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      background: #1557b0;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .warning {
      padding: 14px;
      margin-bottom: 20px;
      color: #93370d;
      background: #fffaeb;
      border: 1px solid #fedf89;
      border-radius: 9px;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">

    <div class="brand">
      <div class="brand-mark">B</div>
      BootBros
    </div>

    <a
      href="/boot-reason.html"
      class="back"
    >
      ← Boot Reason
    </a>

  </header>

  <main class="main">

    <h1>Verify Vehicle</h1>

    <div class="subtitle">
      Confirm the vehicle before capturing
      installation evidence.
    </div>

    <div class="warning">
      Verify the physical vehicle against the
      information below before proceeding.
    </div>

    <section class="card">

      <h2>Vehicle Information</h2>

      <div class="grid">

        <div class="field">
          <label>LICENSE PLATE</label>

          <input
            id="plate"
            readonly
          >
        </div>

        <div class="field">
          <label>STATE</label>

          <input
            id="state"
            readonly
          >
        </div>

        <div class="field">
          <label>MAKE</label>

          <input
            id="make"
            readonly
          >
        </div>

        <div class="field">
          <label>MODEL</label>

          <input
            id="model"
            readonly
          >
        </div>

        <div class="field">
          <label>COLOR</label>

          <input
            id="color"
            readonly
          >
        </div>

        <div class="field">
          <label>VIN</label>

          <input
            id="vin"
            placeholder="Enter VIN if required"
          >
        </div>

        <div class="field">
          <label>LOCATION</label>

          <input
            id="location"
            placeholder="Parking lot / address"
            required
          >
        </div>

        <div class="field">
          <label>DATE / TIME</label>

          <input
            id="timestamp"
            readonly
          >
        </div>

      </div>

      <label class="checkbox">

        <input
          id="verified"
          type="checkbox"
        >

        <div>
          <strong>
            I have verified this vehicle.
          </strong>

          <br>

          I confirm that the license plate,
          vehicle characteristics, and physical
          vehicle match the information shown above.
        </div>

      </label>

      <button
        id="continue"
        class="button"
        disabled
      >
        Continue to Evidence →
      </button>

    </section>

  </main>

</div>

<script>

  const token =
    sessionStorage.getItem("bootbros_token");

  const vehicleJson =
    sessionStorage.getItem("boot_vehicle");

  const reasonJson =
    sessionStorage.getItem("boot_reason");

  if (
    !token ||
    !vehicleJson ||
    !reasonJson
  ) {
    window.location.href =
      "/new-boot.html";
  }

  const data =
    JSON.parse(vehicleJson);

  const vehicle =
    data.vehicle;

  document.getElementById("plate")
    .value =
    vehicle.license_plate || "";

  document.getElementById("state")
    .value =
    vehicle.state || "";

  document.getElementById("make")
    .value =
    vehicle.make || "";

  document.getElementById("model")
    .value =
    vehicle.model || "";

  document.getElementById("color")
    .value =
    vehicle.color || "";

  document.getElementById("timestamp")
    .value =
    new Date().toLocaleString();

  const verified =
    document.getElementById("verified");

  const continueButton =
    document.getElementById("continue");

  verified.addEventListener(
    "change",
    () => {
      continueButton.disabled =
        !verified.checked;
    }
  );

  continueButton.addEventListener(
    "click",
    () => {

      const verification = {
        verified: true,

        vin:
          document
            .getElementById("vin")
            .value
            .trim(),

        location:
          document
            .getElementById("location")
            .value
            .trim(),

        verified_at:
          new Date().toISOString()
      };

      if (!verification.location) {
        alert(
          "Enter the vehicle location."
        );
        return;
      }

      sessionStorage.setItem(
        "boot_verification",
        JSON.stringify(
          verification
        )
      );

      window.location.href =
        "/boot-evidence.html";
    }
  );

</script>

</body>
</html>
